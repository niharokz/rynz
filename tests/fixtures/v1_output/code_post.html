<article>
<p>Aliases are shortcuts.</p>

<h2>Basic aliases</h2>

<p><code>bash
alias c='clear'
alias g='git'
</code></p>

<p>Use <code>exa</code> instead of <code>ls</code>. See <a href="/other">the docs</a>.</p>

<p>| alias | does |
|---|---|
| c | clear |</p>
