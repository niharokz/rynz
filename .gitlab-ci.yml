stages:
  - test
  - release

.test:
  stage: test
  script:
    - pip install --quiet -e ".[dev]"
    - pytest -q

test:
  extends: .test
  image: python:${PYTHON}
  parallel:
    matrix:
      - PYTHON: ["3.10", "3.11", "3.12", "3.13", "3.14"]

release:
  stage: release
  image: python:3.13
  script:
    - pip install --quiet build twine
    - python -m build
    - twine check dist/*
    - twine upload --skip-existing -u __token__ -p "$PYPI_TOKEN" dist/*
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  environment: production
