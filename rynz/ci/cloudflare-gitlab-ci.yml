# Build with rynz and deploy to Cloudflare Workers on every push to the default branch.
# Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → CI/CD → Variables.
deploy:
  image: python:3.13-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs npm > /dev/null
    - pip install --quiet rynz
  script:
    - rynz build --check
    - npx --yes wrangler deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
